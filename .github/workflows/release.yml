name: GitHub release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and build
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## {version} — ', 1)[1]
          notes = section.split('\n', 1)[1].split('\n## ', 1)[0].strip()
          Path('release-notes.md').write_text(notes + '\n')
          PY
          python -m pip install build
          python -m build
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" *.whl *.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file ../release-notes.md
