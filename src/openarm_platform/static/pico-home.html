<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1519">
  <link rel="manifest" href="/simulation/pico.webmanifest">
  <link rel="icon" href="/simulation/pico-icon-192.png" sizes="192x192" type="image/png">
  <title>OpenArm 遥操 · OpenArm Teleoperation</title>
  <style>
    :root {color-scheme: dark;}
    * {box-sizing: border-box;}
    body {margin: 0; min-height: 100vh; display: grid; place-items: center;
          background: #0c1519; color: #edf5f4; font: 1rem/1.5 system-ui, sans-serif;}
    main {width: min(100%, 54rem); padding: clamp(1.25rem, 5vw, 3rem);}
    h1 {margin: 0 0 1.25rem; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.15;}
    nav {display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem;}
    a {display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 9rem;
       gap: .25rem .8rem; padding: 1.2rem; border: 1px solid #30474e; border-top: 3px solid var(--accent);
       border-radius: .85rem; color: inherit; background: #132227; text-decoration: none;}
    a:first-child {--accent: #81e0c9;}
    a:last-child {--accent: #f5ba75;}
    a:hover {background: #1c3036; border-color: var(--accent);}
    a:focus-visible {outline: 2px solid var(--accent); outline-offset: 4px;}
    strong {display: block; font-size: clamp(1.5rem, 4vw, 2rem);}
    small {display: block; color: #a8bfc2; font-size: .85rem;}
    .arrow {color: var(--accent); font-size: 1.6rem;}
    @media (max-width: 30rem) {nav {grid-template-columns: 1fr;} a {min-height: 6.5rem;}}
  </style>
</head>
<body>
  <main>
    <h1>OpenArm 遥操</h1>
    <nav aria-label="遥操模式 / Teleoperation mode">
      <a href="/simulation/practice">
        <span><strong>仿真</strong><small lang="en">MuJoCo Simulation</small></span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
  </main>
</body>
</html>
